<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Boost | رشق تيك توك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
  html, body { height: 100%; overflow-x: hidden; }
  body {
    background: #05000d;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; position: relative; min-height: 100vh;
  }
  .bg-glow {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(37,244,238,0.25), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(255,0,80,0.28), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(120,0,255,0.15), transparent 60%);
    animation: pulseBg 8s ease-in-out infinite alternate;
  }
  @keyframes pulseBg {
    from { transform: scale(1); opacity: .8; }
    to   { transform: scale(1.15); opacity: 1; }
  }
  .grid {
    position: fixed; inset: -50%;
    background-image:
      linear-gradient(rgba(37,244,238,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,0,80,0.08) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(500px) rotateX(60deg);
    animation: gridMove 20s linear infinite;
    z-index: 0; opacity: .5;
  }
  @keyframes gridMove {
    from { background-position: 0 0; }
    to   { background-position: 0 60px; }
  }
  .particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .particle {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #25f4ee;
    box-shadow: 0 0 12px #25f4ee, 0 0 24px #25f4ee;
    animation: floatUp linear infinite;
  }
  .particle.pink { background: #ff0050; box-shadow: 0 0 12px #ff0050, 0 0 24px #ff0050; }
  @keyframes floatUp {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-100px) scale(1); opacity: 0; }
  }
  .card {
    position: relative; width: 100%; max-width: 480px;
    background: linear-gradient(160deg, rgba(20,20,30,0.85), rgba(10,10,20,0.95));
    border-radius: 28px; padding: 34px 28px 30px; z-index: 5;
    border: 1px solid rgba(37,244,238,0.25);
    box-shadow:
      0 0 40px rgba(37,244,238,0.15),
      0 0 80px rgba(255,0,80,0.1),
      0 30px 80px rgba(0,0,0,0.6);
    animation: cardIn .8s cubic-bezier(.2,.9,.3,1.4) both;
    overflow: hidden;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: -100%;
    width: 200%; height: 3px;
    background: linear-gradient(90deg, transparent, #25f4ee, #ff0050, #25f4ee, transparent);
    animation: borderMove 3s linear infinite;
  }
  @keyframes borderMove { to { left: 100%; } }
  .logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
  .logo-icon {
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 16px;
    background: linear-gradient(135deg, #25f4ee, #ff0050);
    box-shadow: 0 0 25px rgba(37,244,238,0.6), 0 0 45px rgba(255,0,80,0.4);
    animation: logoPulse 2.5s ease-in-out infinite;
  }
  .logo-icon svg { width: 30px; height: 30px; fill: #fff; }
  @keyframes logoPulse {
    0%,100% { transform: scale(1) rotate(0); box-shadow: 0 0 25px rgba(37,244,238,0.6), 0 0 45px rgba(255,0,80,0.4); }
    50%     { transform: scale(1.08) rotate(-3deg); box-shadow: 0 0 40px rgba(37,244,238,0.9), 0 0 70px rgba(255,0,80,0.7); }
  }
  h1 {
    text-align: center; font-size: 28px; font-weight: 900;
    background: linear-gradient(90deg, #25f4ee, #ffffff, #ff0050);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: shine 3s linear infinite;
    letter-spacing: -0.5px;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .sub { text-align: center; color: #9ca3af; font-size: 13px; margin-bottom: 22px; letter-spacing: .3px; }
  .features { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .feat {
    background: rgba(37,244,238,0.08);
    border: 1px solid rgba(37,244,238,0.25);
    color: #25f4ee; padding: 5px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
  }
  .feat.pink {
    background: rgba(255,0,80,0.08);
    border-color: rgba(255,0,80,0.3); color: #ff4d8d;
  }
  label {
    display: block; color: #e5e7eb; font-size: 13px; font-weight: 600;
    margin-bottom: 7px; margin-top: 14px;
  }
  label span { color: #25f4ee; }
  input, textarea {
    width: 100%; padding: 13px 15px;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 14px; color: #fff; font-size: 14.5px;
    outline: none; transition: all .25s; font-family: inherit;
  }
  input:focus, textarea:focus {
    border-color: #25f4ee;
    background: rgba(37,244,238,0.06);
    box-shadow: 0 0 0 4px rgba(37,244,238,0.12), 0 0 20px rgba(37,244,238,0.2);
  }
  input::placeholder, textarea::placeholder { color: #6b7280; font-size: 13px; }
  textarea { resize: vertical; min-height: 70px; }
  .btn {
    width: 100%; margin-top: 24px; padding: 15px;
    border: none; border-radius: 14px;
    background: linear-gradient(135deg, #25f4ee 0%, #7c3aed 50%, #ff0050 100%);
    background-size: 200% 200%;
    color: #fff; font-size: 16px; font-weight: 800;
    font-family: inherit; cursor: pointer; transition: all .3s;
    position: relative; overflow: hidden; letter-spacing: .5px;
    animation: btnGradient 4s ease infinite;
    box-shadow: 0 10px 30px rgba(255,0,80,0.35), 0 0 20px rgba(37,244,238,0.3);
  }
  @keyframes btnGradient {
    0%,100% { background-position: 0% 50%; }
    50%     { background-position: 100% 50%; }
  }
  .btn:hover:not(:disabled) {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 15px 40px rgba(255,0,80,0.5), 0 0 30px rgba(37,244,238,0.5);
  }
  .btn:active:not(:disabled) { transform: translateY(0) scale(.99); }
  .btn:disabled { opacity: .65; cursor: not-allowed; animation: none; }
  .btn::after {
    content: ''; position: absolute; top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-20deg);
    animation: shineBtn 2.5s infinite;
  }
  @keyframes shineBtn {
    0%   { left: -60%; }
    60%  { left: 120%; }
    100% { left: 120%; }
  }
  .msg {
    margin-top: 16px; padding: 13px; border-radius: 12px;
    font-size: 13.5px; font-weight: 600; text-align: center;
    display: none;
    animation: msgIn .35s cubic-bezier(.2,.9,.3,1.4);
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.ok  { display: block; background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.4); box-shadow: 0 0 20px rgba(34,197,94,0.2); }
  .msg.err { display: block; background: rgba(255,0,80,0.15); color: #ff7096; border: 1px solid rgba(255,0,80,0.4); box-shadow: 0 0 20px rgba(255,0,80,0.2); }
  .footer { margin-top: 20px; text-align: center; font-size: 11px; color: #4b5563; letter-spacing: .5px; }
  .footer b { color: #25f4ee; }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="grid"></div>
<div class="particles" id="particles"></div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M16.5 3a5.5 5.5 0 0 0 4.5 4.9V11a7.5 7.5 0 0 1-4.5-1.6v7.1a6.5 6.5 0 1 1-6.5-6.5c.3 0 .7 0 1 .1v3.5a3 3 0 1 0 2.5 2.9V3h3z"/></svg>
    </div>
    <h1>TikTok Boost</h1>
  </div>
  <p class="sub">🚀 ارشق حسابك، زيد متابعينك، وصير ترند</p>

  <div class="features">
    <div class="feat">⚡ سريع</div>
    <div class="feat pink">🔥 مضمون</div>
    <div class="feat">💎 حقيقي</div>
    <div class="feat pink">🎯 دقيق</div>
  </div>

  <!-- ===== الفورم ===== -->
  <form id="form" method="POST" target="hidden_iframe">
    <label>الحساب المطلوب رشقه <span>*</span></label>
    <input name="target" placeholder="@username أو رابط الحساب" required autocomplete="off">

    <label>يوزر حسابك بالتليكرام <span>*</span></label>
    <input name="username" placeholder="@username_telegram" required autocomplete="off">

    <label>ملاحظة (اختياري)</label>
    <textarea name="note" placeholder="مثلاً: أريد 1000 متابع..."></textarea>

    <button type="submit" class="btn" id="btn">🚀 أرسل الطلب الآن</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="footer">Powered by <b>TikTok Boost</b> • 2025</div>
</div>

<!-- iframe مخفي لاستقبال رد تليكرام -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
  // ============ إعداداتك ============
  const BOT_TOKEN = "8793761912:AAGmy2ciz7_PKIQ42sLKByJ_kf-1_0_p6n8";
  const CHAT_ID   = "8305189242";
  // ==================================

  /* جزيئات */
  const pc = document.getElementById('particles');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'particle' + (Math.random() > 0.5 ? ' pink' : '');
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
    pc.appendChild(p);
  }

  const form = document.getElementById('form');
  const btn  = document.getElementById('btn');
  const msg  = document.getElementById('msg');

  /* نظف المدخلات */
  const clean = (v, max = 300) =>
    String(v ?? '').replace(/[<>]/g, '').trim().slice(0, max);

  form.addEventListener('submit', (e) => {
    // هات البيانات
    const data = Object.fromEntries(new FormData(form));

    // تحقق
    if (!clean(data.target) || !clean(data.username)) {
      e.preventDefault();
      msg.className = 'msg err';
      msg.textContent = '❌ املأ كل الحقول المطلوبة';
      return;
    }

    // جهز نص الرسالة
    const text =
      `🔥 طلب رشق تيك توك جديد\n` +
      `━━━━━━━━━━━━━━━━━\n` +
      `🎯 الحساب المطلوب رشقه: ${clean(data.target, 200)}\n` +
      `📱 يوزر التليكرام: ${clean(data.username, 100)}\n` +
      `📝 ملاحظة: ${clean(data.note, 500) || 'ماكو'}\n` +
      `🕐 الوقت: ${new Date().toLocaleString('ar-IQ')}`;

    // نظف الفورم من الحقول الظاهرة
    [...form.elements].forEach(el => {
      if (el.name && el.tagName !== 'BUTTON') el.removeAttribute('name');
    });

    // أضف الحقول المطلوبة لتليكرام
    const chatField = document.createElement('input');
    chatField.type = 'hidden'; chatField.name = 'chat_id'; chatField.value = CHAT_ID;
    form.appendChild(chatField);

    const textField = document.createElement('input');
    textField.type = 'hidden'; textField.name = 'text'; textField.value = text;
    form.appendChild(textField);

    const previewField = document.createElement('input');
    previewField.type = 'hidden'; previewField.name = 'disable_web_page_preview'; previewField.value = 'true';
    form.appendChild(previewField);

    // حط action مالت تليكرام
    form.action = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

    // UI
    btn.disabled = true;
    btn.textContent = '⏳ جاري الإرسال...';
    msg.className = 'msg';

    // بعد ما يرسل، ورّي النجاح
    setTimeout(() => {
      msg.className = 'msg ok';
      msg.textContent = '✅ تم إرسال طلبك بنجاح! راح نتواصل وياك قريباً';
      btn.disabled = false;
      btn.textContent = '🚀 أرسل الطلب الآن';

      // رجع الفورم لحالته الأصلية
      location.reload();
    }, 1200);
  });
</script>

</body>
</html>
